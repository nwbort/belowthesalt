name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Hourly at 23 minutes past the hour
  - cron: '23 * * * *'

permissions:
  contents: write

env:
  PRODUCT_FILE: tiny-kingdom-music.myshopify.com-products-haley-blais-below-the-salt-12-vinyl.html
  NTFY_TOPIC: belowthesalt-restock-7e89c4cb25e3

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
    - uses: actions/checkout@v4
    - name: Capture previous stock status
      id: prev
      run: |
        if [ -f "$PRODUCT_FILE" ] && grep -q '"available":true' "$PRODUCT_FILE"; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Create scrape.sh if it doesn't exist
      run: |
        if [ ! -f "scrape.sh" ]; then
          echo '#!/bin/bash' > scrape.sh
          if [[ "$REPO_DESC" == http://* ]] || [[ "$REPO_DESC" == https://* ]]; then
            echo "./download.sh '$REPO_DESC'" >> scrape.sh
          else
            echo "# ./download.sh 'https://www.example.com/'" >> scrape.sh
          fi
          chmod +x scrape.sh
          echo "Created scrape.sh"
          # And replace README.md
          echo -e "# Scheduled scraper\n\nFor $REPO_DESC" > README.md 
        fi
      env:
        REPO_DESC: ${{ github.event.repository.description }}
    # Uncomment to use Python:
    # - name: Set up Python 3.13
    #   uses: actions/setup-python@v5
    #   with:
    #     python-version: "3.13"
    #     cache: "pip"
    # - name: Install dependencies
    #   run: |
    #     pip install -r requirements.txt
    # Uncomment to use Playwright via shot-scraper (put shot-scraper in requirements.txt):
    # - name: Cache Playwright browsers
    #   uses: actions/cache@v4
    #   with:
    #     path: ~/.cache/ms-playwright/
    #     key: ${{ runner.os }}-browsers
    # - name: Install Playwright dependencies
    #   run: |
    #     shot-scraper install
    - name: Run the scraper
      run: |
        ./scrape.sh
    - name: Notify if back in stock
      run: |
        if grep -q '"available":true' "$PRODUCT_FILE" && [ "${{ steps.prev.outputs.available }}" != "true" ]; then
          curl -s \
            -H "Title: Back in stock!" \
            -H "Priority: high" \
            -H "Tags: tada" \
            -d "Haley Blais - Below the Salt (12\" Vinyl) is back in stock: https://tiny-kingdom-music.myshopify.com/products/haley-blais-below-the-salt-12-vinyl" \
            "https://ntfy.sh/$NTFY_TOPIC"
        fi
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git pull --rebase
        git push
