name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Hourly at 23 minutes past the hour
  - cron: '23 * * * *'

permissions:
  contents: write

env:
  STATUS_FILE: status.json
  NTFY_TOPIC: belowthesalt-restock-7e89c4cb25e3

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Capture previous stock status
      id: prev
      run: |
        if [ -f "$STATUS_FILE" ] && [ "$(jq -r '.available' "$STATUS_FILE")" = "true" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$STATUS_FILE" ]; then
          cp "$STATUS_FILE" /tmp/prev_status.json
        else
          echo '{}' > /tmp/prev_status.json
        fi
    - name: Run the scraper
      run: |
        ./scrape.sh
    - name: Notify if back in stock
      run: |
        if [ "$(jq -r '.available' "$STATUS_FILE")" = "true" ] && [ "${{ steps.prev.outputs.available }}" != "true" ]; then
          curl -s \
            -H "Title: Back in stock!" \
            -H "Priority: high" \
            -H "Tags: tada" \
            -d "Haley Blais - Below the Salt (12\" Vinyl) is back in stock: https://tiny-kingdom-music.myshopify.com/products/haley-blais-below-the-salt-12-vinyl" \
            "https://ntfy.sh/$NTFY_TOPIC"
        fi
    - name: Notify if description changed
      run: |
        old_description="$(jq -r '.description // ""' /tmp/prev_status.json)"
        new_description="$(jq -r '.description // ""' "$STATUS_FILE")"
        if [ -n "$old_description" ] && [ "$old_description" != "$new_description" ]; then
          curl -s \
            -H "Title: Product description changed" \
            -H "Priority: default" \
            -H "Tags: memo" \
            --data-binary "Haley Blais - Below the Salt (12\" Vinyl) listing text changed: https://tiny-kingdom-music.myshopify.com/products/haley-blais-below-the-salt-12-vinyl" \
            "https://ntfy.sh/$NTFY_TOPIC"
        fi
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git pull --rebase
        git push
